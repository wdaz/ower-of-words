<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Tower of Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one illustrated scene per floor, a quest line above it, a dialogue box below it, the journal as an overlay.
   Each floor belongs to a different people and carries its own palette (deliberately single-theme per floor). */
:root{
  --bg:#2a1a12; --ink:#fbeedd; --soft:#d9bfa3; --accent:#e0623b; --panel:#3b261b; --panel2:#4a3123; --line:rgba(251,238,221,.18);
  --ok:#8fd19e; --bad:#ff9a85; --on-accent:#1f120b;
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
body[data-floor="2"]{--bg:#16302b;--ink:#f6f0da;--soft:#bcd2c4;--accent:#f0b43c;--panel:#1f3f38;--panel2:#285047}
body[data-floor="3"]{--bg:#1c2a22;--ink:#eef3e6;--soft:#b5c7ae;--accent:#d27aa8;--panel:#26382d;--panel2:#30463a}
body[data-floor="4"]{--bg:#0f1430;--ink:#ecebff;--soft:#aeb3dd;--accent:#f4c95d;--panel:#1a2148;--panel2:#232c5c}
body[data-floor="5"]{--bg:#251d3d;--ink:#f3eefc;--soft:#c6bce2;--accent:#ff8a5c;--panel:#30264f;--panel2:#3b2f60}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;transition:background .6s}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.top h1{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0;line-height:1}
.floors{display:flex;gap:4px;align-items:flex-end}
.floors span{width:22px;border-radius:3px 3px 0 0;background:var(--line);display:block}
.floors span.on{background:var(--accent)}
.floors span.done{background:var(--soft)}
.top .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .count{display:inline-block;min-width:1.5em;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.8rem;text-align:center}

.quest{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.quest .label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.quest .text{flex:1;min-width:0}
.quest .place{font-family:var(--display);font-size:1.15rem}

.stage{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.stage svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}
.hs .hit{fill:transparent}
.hs:hover .hl,.hs:focus-visible .hl{opacity:1}
.hl{opacity:0;transition:opacity .2s}
.hs:focus{outline:none}
.mark{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#avatar{transition:transform 1s ease-in-out}
.fade-in{animation:fade .8s}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}#avatar{transition:none}body{transition:none}.fade-in{animation:none}}

.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:120px}
.who{display:flex;align-items:center;gap:10px}
.who b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--accent)}
.who .tools{margin-left:auto;display:flex;gap:6px}
.icon{border:1px solid var(--line);background:var(--panel2);border-radius:999px;min-width:36px;height:36px;padding:0 10px}
.line{font-family:var(--display);font-size:1.3rem;line-height:1.55;margin:0}
.line .k{border:0;background:none;padding:0 1px;font:inherit;color:inherit;border-bottom:2px dotted var(--accent);border-radius:2px}
.line .k.known{border-bottom:2px solid var(--ok)}
.line .k:hover{background:var(--line)}
.line .g{font-family:var(--body);font-size:.7rem;color:var(--ok);vertical-align:super;margin-left:2px}
.sign{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:1.4rem;margin:0}
.hint{font-size:.88rem;color:var(--soft);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.msg{margin:0;min-height:1.4em;font-weight:500}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;font-family:var(--display);font-size:1.05rem}
.opt.wrong{border-color:var(--bad);opacity:.55}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:6px 12px;font-family:var(--display);font-size:1.1rem}
.tile.used{visibility:hidden}
.built{min-height:52px;border:2px dashed var(--line);border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built .tile{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mic{width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:1.5rem;flex:none}
.mic.live{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px transparent,0 0 0 4px var(--accent)}}
.heard{margin:0;font-size:1.05rem}
.heard .hit{color:var(--ok);font-weight:700}
.heard .miss{color:var(--bad);text-decoration:line-through}
.meter{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical}
.flex1{flex:1;min-width:0}
.note{font-size:.84rem;color:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:0}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;z-index:10}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:860px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;margin-block:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.8rem;margin:0;line-height:1.1}
.sheet p{margin:0;max-width:64ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:.88rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.page{background:var(--panel);border:1px solid var(--line);border-radius:3px 12px 12px 3px;padding:14px;display:flex;flex-direction:column;gap:10px}
.page.sealed{border-color:var(--ok)}
.page h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.1rem;display:flex;justify-content:space-between;gap:8px}
.page h3 small{font-family:var(--body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ok)}
.entry{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.slot{width:52px;height:52px;border:2px dashed var(--line);border-radius:8px;background:transparent;font-size:1.7rem;display:grid;place-items:center}
.slot.filled{border-style:solid;border-color:var(--soft)}
.slot.picking{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.entry .w{font-family:var(--display);font-size:1.2rem}
.entry .w.unknown{color:var(--soft);letter-spacing:.3em}
.entry .az{display:block;font-family:var(--body);font-size:.8rem;color:var(--ok)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pict{width:48px;height:48px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:1.6rem}
.pict.used{opacity:.3}
.center{text-align:center;align-items:center}
</style>

<div class="wrap">
  <header class="top">
    <h1>Tower of Words</h1>
    <div class="floors" id="floors" aria-label="Qüllə"></div>
    <span class="spacer"></span>
    <button class="btn" id="journalBtn">Dəftər <span class="count" id="jcount">0</span></button>
    <button class="btn" id="menuBtn">Menyu</button>
    <a class="btn" href="../" style="text-decoration:none">3D</a>
  </header>
  <section class="quest" id="quest"></section>
  <div class="stage" id="stage"></div>
  <section class="dialog" id="dialog" aria-live="polite"></section>
</div>
<div id="layer"></div>

<script>
/* ======================= ART HELPERS (flat, Chants-style silhouettes) ======================= */
const G=470; // ground line in the 1000x560 scene
function figure(x,o={}){
  const s=o.s||1, g=o.g||G, h=(o.sit?105:160)*s, w=(o.w||64)*s, top=g-h;
  const hx=x, hy=top+18*s;
  let hat="";
  if(o.hat==="hood") hat=`<path d="M${hx-22*s} ${hy+14*s} Q${hx-24*s} ${hy-26*s} ${hx} ${hy-30*s} Q${hx+24*s} ${hy-26*s} ${hx+22*s} ${hy+14*s} Z" fill="${o.robe}"/>`;
  if(o.hat==="tall") hat=`<path d="M${hx-16*s} ${hy-8*s} L${hx} ${hy-62*s} L${hx+16*s} ${hy-8*s} Z" fill="${o.trim}"/>`;
  if(o.hat==="turban") hat=`<ellipse cx="${hx}" cy="${hy-12*s}" rx="${21*s}" ry="${13*s}" fill="${o.trim}"/>`;
  if(o.hat==="round") hat=`<path d="M${hx-30*s} ${hy-6*s} L${hx+30*s} ${hy-6*s} L${hx+16*s} ${hy-22*s} L${hx-16*s} ${hy-22*s} Z" fill="${o.trim}"/>`;
  if(o.hat==="crown") hat=`<path d="M${hx-17*s} ${hy-8*s} L${hx-17*s} ${hy-30*s} L${hx-8*s} ${hy-18*s} L${hx} ${hy-34*s} L${hx+8*s} ${hy-18*s} L${hx+17*s} ${hy-30*s} L${hx+17*s} ${hy-8*s} Z" fill="${o.trim}"/>`;
  const robe=`<path d="M${x-w/2} ${g} L${x-w*0.28} ${top+40*s} Q${x} ${top+22*s} ${x+w*0.28} ${top+40*s} L${x+w/2} ${g} Z" fill="${o.robe}"/>`;
  const sash=o.trim?`<path d="M${x-w*0.36} ${top+86*s} L${x+w*0.36} ${top+80*s} L${x+w*0.38} ${top+92*s} L${x-w*0.38} ${top+98*s} Z" fill="${o.trim}"/>`:"";
  const head=`<circle cx="${hx}" cy="${hy}" r="${17*s}" fill="${o.skin||'#2a1a14'}"/>`;
  const mask=`<ellipse cx="${hx}" cy="${hy+1*s}" rx="${13*s}" ry="${15*s}" fill="${o.mask||'#f2e6d0'}"/><rect x="${hx-9*s}" y="${hy-2*s}" width="${18*s}" height="${3.2*s}" rx="${1.6*s}" fill="#1a1010"/>`;
  let prop="";
  if(o.prop==="spear") prop=`<line x1="${x+w*0.55}" y1="${g}" x2="${x+w*0.55}" y2="${top-40*s}" stroke="#2a1a14" stroke-width="${4*s}"/><path d="M${x+w*0.55-7*s} ${top-36*s} L${x+w*0.55} ${top-62*s} L${x+w*0.55+7*s} ${top-36*s} Z" fill="${o.trim}"/>`;
  if(o.prop==="staff") prop=`<line x1="${x-w*0.55}" y1="${g}" x2="${x-w*0.55}" y2="${top+10*s}" stroke="#5a3a24" stroke-width="${5*s}" stroke-linecap="round"/>`;
  if(o.prop==="book") prop=`<rect x="${x+w*0.18}" y="${top+66*s}" width="${22*s}" height="${16*s}" rx="2" fill="${o.trim}"/>`;
  if(o.prop==="scroll") prop=`<rect x="${x-w*0.42}" y="${top+70*s}" width="${10*s}" height="${30*s}" rx="4" fill="#efe2c4"/>`;
  return `<g>${prop}${robe}${sash}${head}${mask}${hat}</g>`;
}
const arch=(x,y,w,h,fill)=>`<path d="M${x} ${y+h} L${x} ${y+w/2} A${w/2} ${w/2} 0 0 1 ${x+w} ${y+w/2} L${x+w} ${y+h} Z" fill="${fill}"/>`;
const plate=(x,y,txt,fill="#f2e3c4",ink="#2a1a12",fs=18)=>{const w=txt.length*fs*0.72+22;return `<g><rect x="${x-w/2}" y="${y-fs}" width="${w}" height="${fs*1.6}" rx="3" fill="${fill}" stroke="${ink}" stroke-width="1.5"/><text x="${x}" y="${y+fs*0.22}" text-anchor="middle" font-family="Marcellus,Georgia,serif" font-size="${fs}" letter-spacing="2" fill="${ink}">${txt}</text></g>`;};
const emo=(x,y,e,fs=34)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${fs}">${e}</text>`;
const stars=(n,seed,w=1000,h=300)=>{let s="",r=seed;const rnd=()=>(r=(r*9301+49297)%233280)/233280;for(let i=0;i<n;i++)s+=`<circle cx="${(rnd()*w).toFixed(0)}" cy="${(rnd()*h).toFixed(0)}" r="${(rnd()*1.6+.4).toFixed(1)}" fill="#fff" opacity="${(rnd()*.6+.3).toFixed(2)}"/>`;return s;};

/* ======================= CONTENT ======================= */
const TRAVELER={robe:"#f4efe6",trim:"#c8402a",mask:"#ffffff",hat:"hood"};

const FLOORS=[
/* ---------------- 1. THE GATE ---------------- */
{ name:"The Gate", people:"Gözətçilər", cefr:"A2",
  story:"Səhra boyunca uzun yol gəldin. Qarşında Sözlər Qülləsi yüksəlir. Deyirlər, zirvəyə çatan hər xalqın dilini anlayır. Amma darvaza bağlıdır və gözətçi sənin dilini bilmir.",
  words:[
    {w:"water",p:"💧",az:"su"},{w:"bread",p:"🍞",az:"çörək"},{w:"door",p:"🚪",az:"qapı"},{w:"key",p:"🔑",az:"açar"},
    {w:"tired",p:"😩",az:"yorğun"},{w:"give",p:"🤲",az:"vermək"},{w:"open",p:"🔓",az:"açmaq"},{w:"friend",p:"🤝",az:"dost"}],
  forms:{opened:"open",friends:"friend",gave:"give"},
  bg(st){return `
    <defs><linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c27a"/><stop offset="1" stop-color="#e88a55"/></linearGradient></defs>
    <rect width="1000" height="560" fill="url(#sky1)"/>
    <circle cx="140" cy="110" r="54" fill="#fde3a6" opacity=".9"/>
    <path d="M0 330 Q200 300 380 330 T760 320 T1000 330 L1000 560 L0 560 Z" fill="#d97a4a"/>
    <rect x="560" y="20" width="440" height="460" fill="#b85a3a"/>
    <rect x="560" y="20" width="440" height="24" fill="#8e3f28"/>
    ${[600,660,940].map(x=>arch(x,80,36,70,"#7a3220")).join("")}
    <rect x="0" y="${G}" width="1000" height="90" fill="#6b3322"/>
    <rect x="0" y="${G}" width="1000" height="6" fill="#4d2216"/>`;},
  spots:[
    {id:"well",x:150,box:[80,330,140,150],label:"WATER",draw:()=>`
      <rect x="100" y="400" width="100" height="70" fill="#9a8b7a"/><ellipse cx="150" cy="400" rx="50" ry="12" fill="#3b5c78"/>
      <line x1="104" y1="400" x2="104" y2="340" stroke="#4d2a1a" stroke-width="6"/><line x1="196" y1="400" x2="196" y2="340" stroke="#4d2a1a" stroke-width="6"/>
      <rect x="96" y="334" width="108" height="10" fill="#4d2a1a"/><line x1="150" y1="344" x2="150" y2="385" stroke="#2a1a14" stroke-width="2"/>
      ${plate(150,445,"WATER","#e9dcc4","#2a1a12",15)}`},
    {id:"bread",x:300,box:[240,380,120,90],label:"BREAD",draw:()=>`
      <rect x="250" y="420" width="100" height="12" fill="#5a3320"/><rect x="258" y="432" width="8" height="38" fill="#5a3320"/><rect x="334" y="432" width="8" height="38" fill="#5a3320"/>
      ${emo(285,418,"🍞",30)}${emo(318,418,"🍞",30)}${plate(300,458,"BREAD","#e9dcc4","#2a1a12",13)}`},
    {id:"pilgrim",x:420,npc:"Pilgrim",box:[380,350,80,120],draw:()=>figure(420,{sit:true,s:.95,robe:"#7a6a8c",trim:"#d9b44a",mask:"#d8c8b0",hat:"hood",prop:"staff"}),
      idle:["I am so tired.","The door is closed. I can't open it."]},
    {id:"key",x:720,box:[690,200,60,90],label:"KEY",draw:st=>st.has("tookKey")?`<path d="M712 230 q8 -16 16 0" stroke="#2a1a14" stroke-width="4" fill="none"/>`:`
      <path d="M712 230 q8 -16 16 0" stroke="#2a1a14" stroke-width="4" fill="none"/>${emo(720,268,"🔑",34)}${plate(720,288,"KEY","#e9dcc4","#2a1a12",12)}`},
    {id:"keeper",x:640,npc:"Keeper",box:[590,270,110,200],draw:()=>figure(640,{s:1.15,robe:"#9a2f22",trim:"#e2b04a",mask:"#f4e8d2",hat:"tall",prop:"spear"}),
      idle:["Stop! This door is closed.","Only a friend can open the door."]},
    {id:"door",x:850,exit:true,box:[780,180,140,290],draw:st=>st.open?`
      ${arch(780,180,140,290,"#1d0f0a")}<path d="M790 470 L790 260 L820 250 L820 470 Z" fill="#6e3b22"/>${emo(850,420,"✨",40)}`:`
      ${arch(780,180,140,290,"#5e2f1c")}${arch(790,190,120,280,"#7a4126")}<line x1="850" y1="200" x2="850" y2="470" stroke="#4a2414" stroke-width="4"/>
      <circle cx="870" cy="350" r="7" fill="#e2b04a"/>${plate(850,240,"DOOR","#e9dcc4","#2a1a12",14)}`,
      locked:"The door is closed. You need the key."}
  ],
  tasks:[
    {npc:"pilgrim",type:"fetch",hint:"Yorğun zəvvarla danış.",say:["Oh, traveler. I am so tired.","Please, give me water."],
     target:"well",doHint:"Ona nə lazımdır? Səhnədə tap.",done:"Thank you, my friend! Water is life."},
    {npc:"pilgrim",type:"fetch",hint:"Zəvvar yenə nə isə istəyir.",say:["I am hungry too.","Can you give me some bread?"],
     target:"bread",doHint:"Ona nə lazımdır? Səhnədə tap.",done:"You are kind. The keeper only opens the door for a friend."},
    {npc:"keeper",type:"build",hint:"Gözətçiyə yaxınlaş.",say:["Stop! Who are you?","Are you a friend?"],
     answer:"I am your friend",extra:["door","water","open","you"],done:"A friend? Good. Then take the key and open the door."},
    {npc:"keeper",type:"fetch",hint:"Gözətçi nə dedi?",say:["Take the key from the wall."],
     target:"key",flag:"tookKey",doHint:"Divarda nə var?",done:"Now open the door, friend. The tower is waiting."}
  ]},

/* ---------------- 2. THE MARKET ---------------- */
{ name:"The Market", people:"Tacirlər", cefr:"A2+",
  story:"Darvazanın arxasında səs-küylü bir bazar var. Tacirlər öz dillərində qışqırır, qiymətlər divarlara yazılıb. Yuxarı qalxmaq üçün bazarın qaydalarını anlamalısan.",
  words:[
    {w:"buy",p:"🛒",az:"almaq"},{w:"sell",p:"🏷️",az:"satmaq"},{w:"fruit",p:"🍎",az:"meyvə"},{w:"fish",p:"🐟",az:"balıq"},
    {w:"cheap",p:"🪙",az:"ucuz"},{w:"expensive",p:"💰",az:"bahalı"},{w:"need",p:"❗",az:"ehtiyac duymaq"},{w:"coins",p:"⚪",az:"sikkələr"}],
  forms:{sells:"sell",bought:"buy",sold:"sell",needs:"need",coin:"coins"},
  bg(){return `
    <defs><linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0c2"/><stop offset="1" stop-color="#cfe9d8"/></linearGradient></defs>
    <rect width="1000" height="560" fill="url(#sky2)"/>
    <rect x="0" y="60" width="1000" height="420" fill="#2f6d60"/>
    ${[40,250,460,670].map(x=>arch(x,110,150,220,"#22524a")).join("")}
    <rect x="0" y="${G}" width="1000" height="90" fill="#1d3f39"/>
    <path d="M900 470 L900 420 L930 420 L930 380 L960 380 L960 340 L990 340 L990 300 L1000 300 L1000 470 Z" fill="#183530"/>`;},

/* ======================= STATE ======================= */
const KEY="tower-of-words-v2";
const fresh=()=>({started:false,floor:0,rate:.9,f:FLOORS.map(()=>({task:0,talked:false,seen:[],guess:{},sealed:[],flags:[],free:""})),ended:false});
let S=fresh();
function load(d){if(d&&Array.isArray(d.f)&&d.f.length===FLOORS.length)S=Object.assign(fresh(),d);}
try{load(JSON.parse(localStorage.getItem(KEY)||"null"));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const F=()=>FLOORS[S.floor], FS=()=>S.f[S.floor];
const flags=()=>{const s=new Set(FS().flags);return s;};
const tasksDone=fi=>S.f[fi].task>=FLOORS[fi].tasks.length;
const pagesOf=fi=>[FLOORS[fi].words.slice(0,4),FLOORS[fi].words.slice(4,8)];
const journalDone=fi=>S.f[fi].sealed.length===2;
const exitOpen=fi=>tasksDone(fi)&&journalDone(fi);
const knownWord=(fi,w)=>pagesOf(fi).some((p,i)=>S.f[fi].sealed.includes(i)&&p.some(x=>x.w===w));

/* ======================= VOICE OUT ======================= */
let voice=null;
function pickVoice(){const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];voice=vs.find(v=>/en[-_](US|GB)/i.test(v.lang)&&/Google|Natural|Samantha|Daniel|Aria|Jenny/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null;}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text,rate){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||S.rate;speechSynthesis.speak(u);}

/* ======================= VOICE IN ======================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micBroken=!SR;
function listenOnce(onText,onEnd){
  const r=new SR();r.lang="en-US";r.interimResults=true;r.continuous=false;let fin="";
  r.onresult=e=>{let t="";for(const res of e.results)t+=res[0].transcript;fin=t;onText(t);};
  r.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error))micBroken=true;onEnd(e.error,fin);};
  r.onend=()=>onEnd(null,fin);
  try{r.start();}catch(e){micBroken=true;onEnd("start","");}
  return r;
}
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\bi'm\b/g,"i am").replace(/\bit's\b/g,"it is").replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"cannot").replace(/\bi've\b/g,"i have").replace(/\bi'll\b/g,"i will").replace(/[^a-z' ]+/g," ").trim().split(/\s+/).filter(Boolean);
/* Word-level longest common subsequence: order matters, small slips are forgiven. */
function scoreSpeech(target,heard){
  const a=norm(target),b=norm(heard);
  const L=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)L[i][j]=a[i]===b[j]?1+L[i+1][j+1]:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Array(a.length).fill(false);
  for(let i=0,j=0;i<a.length&&j<b.length;){if(a[i]===b[j]){hit[i]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  return {score:a.length?L[0][0]/a.length:0,words:a,hit};
}
const PASS=.75;

/* ======================= DOM HELPERS ======================= */
const $=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stage=document.getElementById("stage"),dialog=document.getElementById("dialog"),quest=document.getElementById("quest"),layer=document.getElementById("layer");
let avatarX=40;

/* words in a line: key words are underlined; seeing them notes them in the journal */
function lineEl(text){
  const fl=F(),fi=S.floor,keys=new Map(fl.words.map(x=>[x.w,x]));
  const p=document.createElement("p");p.className="line";
  text.split(/(\s+)/).forEach(tok=>{
    if(/^\s+$/.test(tok)||!tok){p.append(tok);return;}
    const m=tok.match(/^([A-Za-z']+)(.*)$/);if(!m){p.append(tok);return;}
    const lw=m[1].toLowerCase(),base=keys.has(lw)?lw:(fl.forms&&fl.forms[lw]);
    if(base&&keys.has(base)){
      if(!FS().seen.includes(base)){FS().seen.push(base);save();updateCount();}
      const b=$(`<button class="k${knownWord(fi,base)?" known":""}" title="Dəftərə yazıldı">${esc(m[1])}</button>`);
      b.onclick=()=>speak(m[1]);p.append(b);
      if(knownWord(fi,base))p.append($(`<span class="g">${esc(keys.get(base).az)}</span>`));
    }else{const b=$(`<button class="k" style="border-bottom-color:transparent">${esc(m[1])}</button>`);b.onclick=()=>speak(m[1]);p.append(b);}
    p.append(m[2]);
  });
  return p;
}

/* ======================= SCENE ======================= */
function sceneState(){const st=flags();st.open=exitOpen(S.floor);return st;}
function renderScene(){
  const fl=F(),st=sceneState(),t=fl.tasks[FS().task];
  let svg=`<svg viewBox="0 0 1000 560" role="img" aria-label="${esc(fl.name)}" xmlns="http://www.w3.org/2000/svg">${fl.bg(st)}`;
  fl.spots.forEach(sp=>{
    const [bx,by,bw,bh]=sp.box;
    const marker=(t&&t.npc===sp.id&&!FS().talked)||(sp.exit&&st.open)?`<g class="mark"><path d="M${sp.x-9} ${by-26} L${sp.x} ${by-12} L${sp.x+9} ${by-26} L${sp.x} ${by-40} Z" fill="#fff6c8" stroke="#2a1a12" stroke-width="2"/></g>`:"";
    svg+=`<g class="hs" data-id="${sp.id}" tabindex="0" role="button" aria-label="${esc(sp.npc||sp.label||sp.id)}"><rect class="hl" x="${bx-4}" y="${by-4}" width="${bw+8}" height="${bh+8}" rx="10" fill="rgba(255,246,200,.16)" stroke="rgba(255,246,200,.6)" stroke-dasharray="6 5"/>${sp.draw(st)}<rect class="hit" x="${bx}" y="${by}" width="${bw}" height="${bh}"/>${marker}</g>`;
  });
  svg+=`<g id="avatar" style="transform:translateX(${avatarX}px)">${figure(0,{s:.85,...TRAVELER})}</g></svg>`;
  stage.innerHTML=svg;
  stage.querySelectorAll(".hs").forEach(g=>{
    const go=()=>clickSpot(g.dataset.id);
    g.addEventListener("click",go);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
}
function walkTo(x){avatarX=Math.max(30,Math.min(970,x-70));const a=document.getElementById("avatar");if(a)a.style.transform=`translateX(${avatarX}px)`;}

/* ======================= QUEST BAR ======================= */
function renderQuest(){
  const fl=F(),fs=FS(),t=fl.tasks[fs.task];
  let text;
  if(t) text=fs.talked&&t.doHint?t.doHint:t.hint;
  else if(!journalDone(S.floor)) text=`Dəftəri aç: ${2-fs.sealed.length} səhifəni deşifrə et. Sözləri personajların danışığından topladın.`;
  else text=S.floor===FLOORS.length-1?"Zəngi çal.":"Yol açıqdır. Yuxarı qalx.";
  quest.innerHTML=`<span class="label">${esc(fl.people)} · ${fl.cefr}</span><span class="place">${esc(fl.name)}</span><span class="text">${esc(text)}</span>`;
  const fb=document.getElementById("floors");fb.innerHTML="";
  FLOORS.forEach((_,i)=>fb.appendChild($(`<span class="${i===S.floor?"on":exitOpen(i)?"done":""}" style="height:${10+i*5}px" title="${esc(FLOORS[i].name)}"></span>`)));
}
function updateCount(){const fs=FS();document.getElementById("jcount").textContent=fs.seen.length+"/8";}

/* ======================= DIALOGUE ======================= */
function speakerHead(name,lines){
  const h=$(`<div class="who"><b>${esc(name)}</b><span class="tools"><button class="icon" aria-label="Dinlə">▶</button><button class="icon" aria-label="Yavaş dinlə">🐢</button></span></div>`);
  const all=lines.join(" ");
  const [p1,p2]=h.querySelectorAll("button");p1.onclick=()=>speak(all);p2.onclick=()=>speak(all,.65);
  return h;
}
function showLines(name,lines,after){
  dialog.innerHTML="";dialog.appendChild(speakerHead(name,lines));
  lines.forEach(l=>dialog.appendChild(lineEl(l)));
  speak(lines.join(" "));
  if(after)after(dialog);
}
function say(text){dialog.innerHTML="";dialog.appendChild($(`<p class="hint">${esc(text)}</p>`));}

function clickSpot(id){
  const fl=F(),fs=FS(),sp=fl.spots.find(s=>s.id===id),t=fl.tasks[fs.task];
  walkTo(sp.x);
  if(sp.exit){
    if(exitOpen(S.floor)){ return S.floor===FLOORS.length-1?ending():climb(); }
    const why=!tasksDone(S.floor)?sp.locked:"Yol hələ bağlıdır: dəftərdə deşifrə olunmamış səhifələr var.";
    return showLines(sp.npc||"",[why].filter(x=>/^[A-Z]/.test(x)&&!/[əğış]/.test(x)),d=>{if(/[əğış]/.test(why))d.appendChild($(`<p class="hint">${esc(why)}</p>`));});
  }
  // active fetch task: was this the thing they asked for?
  if(t&&fs.talked&&t.type==="fetch"&&!sp.npc){
    if(id===t.target){ if(t.flag)fs.flags.push(t.flag); completeTask(t); return; }
  }
  if(sp.npc){
    if(t&&t.npc===id){ fs.talked=true; save(); renderQuest(); renderScene(); return runTask(t,sp); }
    const idle=sp.idle||["…"]; return showLines(sp.npc,[idle[Math.floor(Math.random()*idle.length)]]);
  }
  // plain object: read its sign / label
  dialog.innerHTML="";
  dialog.appendChild(speakerHead("",[sp.label]));
  dialog.firstElementChild.querySelector("b").textContent="";
  const p=lineEl(sp.label);p.classList.add("sign");dialog.appendChild(p);
  speak(sp.label.replace("·",","));
  if(t&&fs.talked&&t.type==="fetch") dialog.appendChild($(`<p class="hint">Bu deyil. Onun nə istədiyini yenidən dinlə.</p>`));
}

function runTask(t,sp){
  showLines(sp.npc,t.say,d=>{
    if(t.type==="fetch") d.appendChild($(`<p class="hint">${esc(t.doHint)}</p>`));
    if(t.type==="line"){const b=$(`<button class="btn primary">Anladım</button>`);b.onclick=()=>completeTask(t);d.appendChild($(`<div class="row"></div>`)).appendChild(b);}
    if(t.type==="choice") choiceUI(t,d);
    if(t.type==="build") buildUI(t,d);
    if(t.type==="free") freeUI(t,d);
  });
}
function completeTask(t){
  const fs=FS(),fl=F();
  if(t.flagAfter)fs.flags.push(t.flagAfter);
  fs.task++;fs.talked=false;save();
  renderScene();renderQuest();
  const sp=fl.spots.find(s=>s.id===t.npc);
  if(t.done) showLines(sp.npc,[t.done],d=>{
    if(tasksDone(S.floor)&&!journalDone(S.floor)){const b=$(`<button class="btn primary">Dəftəri aç</button>`);b.onclick=openJournal;d.appendChild($(`<div class="row"></div>`)).appendChild(b);}
  });
}

function choiceUI(t,d){
  const box=$(`<div class="opts"></div>`),msg=$(`<p class="msg"></p>`);
  t.opts.map((o,i)=>[o,i]).sort(()=>Math.random()-.5).forEach(([o,i])=>{
    const b=$(`<button class="opt">${esc(o)}</button>`);
    b.onclick=()=>{speak(o);if(i===t.a)setTimeout(()=>completeTask(t),900);else{b.classList.add("wrong");msg.className="msg bad";msg.textContent="Yox, bir daha dinlə.";}};
    box.appendChild(b);
  });
  d.append(box,msg);
}

function buildUI(t,d){
  const target=t.answer.split(" ");
  const pool=[...target,...t.extra].map((w,i)=>({w,i})).sort(()=>Math.random()-.5);
  let built=[];
  d.appendChild($(`<p class="hint">Cavabı sözlərdən qur, sonra ucadan de.</p>`));
  const area=$(`<div class="built" aria-label="Sənin cümlən"></div>`),tiles=$(`<div class="tiles"></div>`),msg=$(`<p class="msg"></p>`);
  const row=$(`<div class="row"><button class="btn">Təmizlə</button><button class="btn primary">Yoxla</button></div>`);
  const draw=()=>{
    area.innerHTML="";built.forEach((x,k)=>{const b=$(`<button class="tile">${esc(x.w)}</button>`);b.onclick=()=>{built.splice(k,1);draw();};area.appendChild(b);});
    tiles.innerHTML="";pool.forEach(x=>{const b=$(`<button class="tile${built.includes(x)?" used":""}">${esc(x.w)}</button>`);b.onclick=()=>{built.push(x);speak(x.w);draw();};tiles.appendChild(b);});
  };
  const [clr,chk]=row.querySelectorAll("button");
  clr.onclick=()=>{built=[];draw();};
  chk.onclick=()=>{
    const s=built.map(x=>x.w).join(" ");
    if(norm(s).join(" ")===norm(t.answer).join(" ")){ msg.className="msg ok";msg.textContent="Doğrudur! İndi bunu ucadan de.";area.remove();tiles.remove();row.remove();speakUI(t.answer,d,()=>completeTask(t)); }
    else{msg.className="msg bad";msg.textContent=built.length<target.length?"Cümlə tam deyil.":"Söz sırası və ya sözlər səhvdir.";}
  };
  draw();d.append(area,tiles,row,msg);
}

function speakUI(target,d,onPass){
  const box=$(`<div class="stack" style="display:flex;flex-direction:column;gap:10px"><p class="line" style="font-size:1.4rem">“${esc(target)}”</p><div class="row act"></div><p class="heard"></p><div class="meter"><i></i></div><p class="msg"></p></div>`);
  const act=box.querySelector(".act"),heard=box.querySelector(".heard"),bar=box.querySelector(".meter i"),msg=box.querySelector(".msg");
  const play=$(`<button class="icon" aria-label="Nümunəni dinlə">▶</button>`);play.onclick=()=>speak(target);
  const judge=text=>{
    const r=scoreSpeech(target,text);
    heard.innerHTML=r.words.map((w,k)=>`<span class="${r.hit[k]?"hit":"miss"}">${esc(w)}</span>`).join(" ");
    bar.style.width=Math.round(r.score*100)+"%";
    if(r.score>=PASS){msg.className="msg ok";msg.textContent=`Səni anladılar (${Math.round(r.score*100)}%).`;setTimeout(onPass,1100);}
    else{msg.className="msg bad";msg.textContent=`${Math.round(r.score*100)}%. Qırmızı sözlərə diqqət et və yenə de.`;}
  };
  const build=()=>{
    act.innerHTML="";
    if(!micBroken){
      const mic=$(`<button class="mic" aria-label="Danış">🎙</button>`);let rec=null;
      mic.onclick=()=>{
        if(rec){rec.stop();return;}
        window.speechSynthesis&&speechSynthesis.cancel();mic.classList.add("live");heard.textContent="Dinləyirəm…";
        rec=listenOnce(t=>heard.textContent=t,(err,fin)=>{
          mic.classList.remove("live");rec=null;
          if(micBroken){build();return;}
          if(fin)judge(fin);else{msg.className="msg bad";msg.textContent=err&&err!=="no-speech"?"Səs alınmadı: "+err:"Heç nə eşidilmədi. Bas və danış.";}
        });
      };
      act.append(mic,play,$(`<span class="hint">Mikrofona bas və cümləni de.</span>`));
    }else{
      const inp=$(`<input type="text" id="say-${S.floor}-${FS().task}" placeholder="Ucadan de, sonra dediyini yaz…" autocomplete="off">`);inp.classList.add("flex1");
      const ok=$(`<button class="btn primary">Yoxla</button>`);ok.onclick=()=>judge(inp.value);inp.onkeydown=e=>{if(e.key==="Enter")judge(inp.value);};
      act.append(play,inp,ok);
      act.after($(`<p class="note">Bu pəncərə mikrofona icazə vermir. Cümləni ucadan de və yaz. Mikrofon oyunun öz saytında (GitHub Pages / Vercel) işləyəcək.</p>`));
    }
  };
  build();d.appendChild(box);
}

function freeUI(t,d){
  const fs=FS();
  const box=$(`<div style="display:flex;flex-direction:column;gap:10px"><p class="hint">Ən azı ${t.min} söz. Səhvlərdən qorxma: məqsəd axıcılıqdır. Fikir: “My name is… I work as… I am learning English because… Next year I want to…”</p><div class="row act"></div><textarea id="free-talk" placeholder="Danışdıqların burada görünəcək…"></textarea><div class="row"><span class="msg flex1"></span><button class="btn primary">Şuraya təqdim et</button></div></div>`);
  const ta=box.querySelector("textarea"),msg=box.querySelector(".msg"),send=box.querySelector(".btn.primary"),act=box.querySelector(".act");
  ta.value=fs.free;
  const upd=()=>{fs.free=ta.value;save();const n=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;msg.textContent=`${n} söz`+(n>=t.min?" ✓":"");msg.className="msg flex1"+(n>=t.min?" ok":"");send.disabled=n<t.min;};
  ta.oninput=upd;upd();
  if(!micBroken){
    const mic=$(`<button class="mic" aria-label="Danış">🎙</button>`);let rec=null;
    mic.onclick=()=>{if(rec){rec.stop();return;}mic.classList.add("live");const base=ta.value.trim();rec=listenOnce(x=>{ta.value=(base?base+" ":"")+x;},()=>{mic.classList.remove("live");rec=null;upd();});};
    act.append(mic,$(`<span class="hint">Bas, danış, dayan. Yenidən basıb davam et.</span>`));
  }
  const rd=$(`<button class="btn">▶ Mətnimi oxu</button>`);rd.onclick=()=>speak(ta.value);act.append(rd);
  send.onclick=()=>completeTask(t);
  d.appendChild(box);
}

/* ======================= JOURNAL ======================= */
let jTab=null,picking=null;
function openJournal(){jTab=S.floor;picking=null;drawJournal();}
function drawJournal(){
  layer.innerHTML="";
  const ov=$(`<div class="overlay" role="dialog" aria-modal="true" aria-label="Dəftər"></div>`),sh=$(`<div class="sheet"></div>`);ov.appendChild(sh);
  ov.onclick=e=>{if(e.target===ov)closeLayer();};
  sh.appendChild($(`<div class="row"><h2 class="flex1">Səyyahın dəftəri</h2><button class="btn" id="jclose">Bağla</button></div>`));
  sh.querySelector("#jclose").onclick=closeLayer;
  const tabs=$(`<div class="tabs" role="tablist"></div>`);
  FLOORS.forEach((fl,i)=>{if(i>S.floor)return;const b=$(`<button role="tab" aria-selected="${i===jTab}">${esc(fl.name)}</button>`);b.onclick=()=>{jTab=i;picking=null;drawJournal();};tabs.appendChild(b);});
  sh.appendChild(tabs);
  const fi=jTab,fs=S.f[fi],words=FLOORS[fi].words;
  sh.appendChild($(`<p class="hint">Personajların danışığında altından xətt çəkilmiş sözlər bura yazılır. Hər sözün xanasına toxun və mənasına uyğun şəkli seç. Səhifənin 4 sözü də doğru olanda səhifə möhürlənir və tərcümə açılır.</p>`));
  const pages=$(`<div class="pages"></div>`);
  pagesOf(fi).forEach((pg,pi)=>{
    const sealed=fs.sealed.includes(pi);
    const el=$(`<div class="page${sealed?" sealed":""}"><h3>Səhifə ${pi+1}${sealed?"<small>Deşifrə edildi</small>":""}</h3></div>`);
    pg.forEach(x=>{
      const seen=fs.seen.includes(x.w),g=sealed?x.p:fs.guess[x.w];
      const e=$(`<div class="entry"><button class="slot${g?" filled":""}${picking===x.w?" picking":""}">${g||""}</button><div class="w${seen?"":" unknown"}">${seen?esc(x.w):"· · ·"}${sealed?`<span class="az">${esc(x.az)}</span>`:""}</div></div>`);
      const slot=e.querySelector(".slot");
      slot.setAttribute("aria-label",seen?`${x.w}: şəkil seç`:"Hələ tapılmayıb");
      if(sealed||!seen)slot.disabled=true;else slot.onclick=()=>{picking=picking===x.w?null:x.w;speak(x.w);drawJournal();};
      if(seen){e.querySelector(".w").style.cursor="pointer";e.querySelector(".w").onclick=()=>speak(x.w);}
      el.appendChild(e);
    });
    if(!sealed){
      const allSeen=pg.every(x=>fs.seen.includes(x.w)),allSet=pg.every(x=>fs.guess[x.w]);
      const msg=$(`<p class="msg"></p>`),chk=$(`<button class="btn primary">Səhifəni yoxla</button>`);
      chk.disabled=!(allSeen&&allSet);
      if(!allSeen){msg.className="msg";msg.innerHTML=`<span class="hint">Bu səhifənin bütün sözlərini hələ eşitməmisən.</span>`;}
      chk.onclick=()=>{
        const wrong=pg.filter(x=>fs.guess[x.w]!==x.p).length;
        if(!wrong){fs.sealed.push(pi);save();pg.forEach((x,i)=>setTimeout(()=>speak(x.w),i*800));drawJournal();renderQuest();renderScene();return;}
        msg.className="msg bad";msg.textContent=wrong===1?"Az qaldı: yalnız bir söz səhvdir.":"Hələ deyil. Bəzi mənalar səhvdir.";
      };
      el.append(chk,msg);
    }
    pages.appendChild(el);
  });
  sh.appendChild(pages);
  if(fs.sealed.length<2){
    const used=new Set(Object.values(fs.guess));
    const pal=$(`<div class="page"><p class="hint">${picking?`<b>${esc(picking)}</b> üçün şəkil seç:`:"Şəkillər. Əvvəlcə bir sözün xanasına toxun."}</p><div class="palette"></div></div>`);
    [...words].sort((a,b)=>a.p<b.p?-1:1).forEach(x=>{
      const b=$(`<button class="pict${used.has(x.p)?" used":""}">${x.p}</button>`);b.disabled=!picking;
      b.onclick=()=>{for(const k in fs.guess)if(fs.guess[k]===x.p)delete fs.guess[k];fs.guess[picking]=x.p;picking=null;save();drawJournal();};
      pal.querySelector(".palette").appendChild(b);
    });
    sh.appendChild(pal);
  }else if(fi===S.floor&&exitOpen(fi)){
    sh.appendChild($(`<p class="msg ok">Bu mərtəbənin dili deşifrə edildi. Çıxış açıqdır.</p>`));
  }
  layer.appendChild(ov);
}
function closeLayer(){layer.innerHTML="";}

/* ======================= FLOW ======================= */
function story(){
  const fl=F();
  layer.innerHTML="";
  const ov=$(`<div class="overlay"><div class="sheet center"><p class="hint" style="letter-spacing:.14em;text-transform:uppercase">Mərtəbə ${S.floor+1} · ${fl.cefr}</p><h2>${esc(fl.name)}</h2><p>${esc(fl.story)}</p><button class="btn primary">Daxil ol</button></div></div>`);
  ov.querySelector("button").onclick=()=>{closeLayer();S.started=true;save();say("Səhnədəki personajlara və əşyalara toxun. Parlayan işarə kiminlə danışmalı olduğunu göstərir.");};
  layer.appendChild(ov);
}
function climb(){S.floor++;avatarX=40;save();renderAll();story();}
function ending(){
  S.ended=true;save();speak("Thank you, traveler. Now every people of the tower will learn.");
  const learned=S.f.reduce((n,f)=>n+f.sealed.length*4,0);
  layer.innerHTML="";
  const ov=$(`<div class="overlay"><div class="sheet center"><h2>Qüllə danışır</h2><p>Zəng çaldı və bütün xalqlar bir-birini eşitdi. Sən ${learned} söz deşifrə etdin, 5 xalqla danışdın və Şuraya öz hekayəni danışdın. A2-dən B1-ə yol belə keçir: hər gün bir az dinlə, bir az danış.</p><div class="row" style="justify-content:center"><button class="btn" id="again">Yenidən başla</button><button class="btn primary" id="stay">Qüllədə qal</button></div></div></div>`);
  ov.querySelector("#again").onclick=()=>{S=fresh();save();renderAll();story();};
  ov.querySelector("#stay").onclick=closeLayer;
  layer.appendChild(ov);
}
function menu(){
  layer.innerHTML="";
  const ov=$(`<div class="overlay"><div class="sheet"><div class="row"><h2 class="flex1">Menyu</h2><button class="btn" id="mclose">Bağla</button></div>
    <label class="row" for="rate">Danışıq sürəti <input id="rate" class="flex1" type="range" min="0.6" max="1.1" step="0.05" value="${S.rate}"></label>
    <p class="hint">Mərtəbələr (keçdiyin mərtəbələrə qayıda bilərsən):</p><div class="tabs" id="mfloors"></div>
    <div class="row"><button class="btn" id="mreset">Oyunu sıfırla</button></div></div></div>`);
  ov.onclick=e=>{if(e.target===ov)closeLayer();};
  ov.querySelector("#mclose").onclick=closeLayer;
  ov.querySelector("#rate").oninput=e=>{S.rate=+e.target.value;save();};
  const mf=ov.querySelector("#mfloors");
  FLOORS.forEach((fl,i)=>{const b=$(`<button aria-selected="${i===S.floor}">${i+1}. ${esc(fl.name)}</button>`);b.disabled=!(i===0||exitOpen(i-1));b.onclick=()=>{S.floor=i;avatarX=40;save();closeLayer();renderAll();say("Səhnədəki personajlara toxun.");};mf.appendChild(b);});
  let armed=false;ov.querySelector("#mreset").onclick=e=>{if(!armed){armed=true;e.target.textContent="Əminsən? Yenidən bas";return;}S=fresh();save();renderAll();story();};
  layer.appendChild(ov);
}
function renderAll(){document.body.dataset.floor=S.floor+1;renderScene();renderQuest();updateCount();say("Səhnədəki personajlara və əşyalara toxun.");}
document.getElementById("journalBtn").onclick=openJournal;
document.getElementById("menuBtn").onclick=menu;

window.claude?.hot?.snapshot?.(()=>S);
function start(d){if(d&&d.f)load(d);renderAll();if(!S.started)story();}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
